server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/chatty;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:chatty}
    password: ${DATABASE_PASSWORD:chatty}
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jdbc:
    template:
      query-timeout: 5s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 65000
chatty:
  model: ${AI_MODEL:gemini-3.8-flash}
  key: ${GEMINI_API_KEY:}
  mode: ${AI_MODE:auto}
  rounds: ${AI_MODEL_MAX_ROUNDS:6}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
